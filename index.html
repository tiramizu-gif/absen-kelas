<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Smart v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #f1f5f9; --bg-card: #ffffff; --text-main: #1e293b;
            --primary: #6366f1; --success: #22c55e; --border: #e2e8f0; --shadow: rgba(0,0,0,0.05);
        }
        [data-theme="dark"] {
            --bg-body: #0f172a; --bg-card: #1e293b; --text-main: #f1f5f9;
            --border: #334155; --shadow: rgba(0,0,0,0.3);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; transition: all 0.3s ease; }
        .navbar { display: flex; background: var(--bg-card); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px var(--shadow); padding: 5px 15px; justify-content: space-between; align-items: center; }
        .tabs { display: flex; gap: 5px; }
        .nav-item { padding: 10px 15px; cursor: pointer; font-weight: 600; border-radius: 8px; transition: 0.2s; color: #64748b; font-size: 14px; }
        .nav-item.active { background: var(--primary); color: white; }
        #theme-btn { background: none; border: none; font-size: 18px; color: var(--text-main); cursor: pointer; }
        .container { max-width: 600px; margin: 15px auto; padding: 0 10px; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px var(--shadow); margin-bottom: 15px; border: 1px solid var(--border); }
        
        /* UKURAN GRAFIK DISINI */
        .chart-container {
            width: 180px; /* Diperkecil dari sebelumnya */
            height: 180px;
            margin: 0 auto 15px auto;
        }

        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 10px; border: 2px solid var(--border); background: var(--bg-body); color: var(--text-main); font-size: 14px; outline: none; }
        button.btn-primary { background: var(--primary); color: white; border: none; font-weight: bold; }
        .table-container { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: var(--bg-body); padding: 10px; text-align: left; }
        td { padding: 10px; border-top: 1px solid var(--border); }
        .hidden { display: none; }
    </style>
</head>
<body data-theme="light">

    <div class="navbar">
        <div class="tabs">
            <div id="tabWaliBtn" class="nav-item active" onclick="switchTab('wali')"><i class="fas fa-users"></i> Wali</div>
            <div id="tabGuruBtn" class="nav-item" onclick="switchTab('guru')"><i class="fas fa-key"></i> Guru</div>
        </div>
        <button id="theme-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    </div>

    <div class="container">
        <div id="tabWali">
            <div class="card">
                <h3 style="margin:0 0 15px 0; text-align:center;">Monitoring Siswa</h3>
                <select id="filterKelasWali" onchange="filterDataWali()">
                    <option value="Semua">Semua Kelas</option>
                    <option value="XI RPL">XI RPL</option>
                    <option value="XII TKR">XII TKR</option>
                </select>
                
                <div class="chart-container">
                    <canvas id="myChart"></canvas>
                </div>

                <button class="btn-primary" onclick="buatPDF()" style="padding:8px; font-size:12px;"><i class="fas fa-file-pdf"></i> Download PDF</button>
            </div>

            <div class="card">
                <h4 style="margin:0 0 10px 0;">Riwayat Absen</h4>
                <div class="table-container">
                    <table>
                        <thead><tr><th>No</th><th>Nama</th><th>Stat</th><th>Tanggal</th></tr></thead>
                        <tbody id="isiTabelWali"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tabGuru" class="hidden">
            <div id="loginGuru" class="card">
                <h3 style="text-align:center;">Login Guru</h3>
                <input type="password" id="passGuru" placeholder="Password Guru">
                <button class="btn-primary" onclick="prosesLogin()">MASUK</button>
            </div>
            <div id="areaAbsen" class="card hidden">
                <h3 id="infoGuru" style="color:var(--primary); text-align:center;"></h3>
                <select id="pilihKelasGuru" onchange="tampilDaftarSiswa()">
                    <option value="">-- Pilih Kelas --</option>
                    <option value="XI RPL">XI RPL</option>
                    <option value="XII TKR">XII TKR</option>
                </select>
                <div id="listSiswa"></div>
                <button id="btnSimpan" class="btn-primary hidden" style="background:var(--success); margin-top:15px;" onclick="simpanAbsen()">SIMPAN ABSENSI</button>
            </div>
        </div>
    </div>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxnACkQb2lwdQlROo52Z2Npe8YfEa5YmpbKNdz397Q4eCe_XCAc_DLvcVSnSlKIpOu7/exec";
        let rawData = [];
        let guruAktif = "";
        let chartInstance = null;

        function toggleTheme() {
            const body = document.body;
            const icon = document.querySelector("#theme-btn i");
            const isDark = body.getAttribute("data-theme") === "dark";
            body.setAttribute("data-theme", isDark ? "light" : "dark");
            icon.className = isDark ? "fas fa-moon" : "fas fa-sun";
            if(rawData.length > 0) filterDataWali(); // Refresh chart color
        }

        window.onload = () => { fetchInitialData(); };

        function switchTab(type) {
            document.getElementById('tabWali').classList.toggle('hidden', type !== 'wali');
            document.getElementById('tabGuru').classList.toggle('hidden', type !== 'guru');
            document.getElementById('tabWaliBtn').classList.toggle('active', type === 'wali');
            document.getElementById('tabGuruBtn').classList.toggle('active', type === 'guru');
        }

        function fetchInitialData() {
            fetch(URL_SCRIPT).then(r => r.json()).then(res => {
                rawData = res.rows;
                filterDataWali();
            });
        }

        function filterDataWali() {
            const kls = document.getElementById("filterKelasWali").value;
            const tbody = document.getElementById("isiTabelWali");
            tbody.innerHTML = "";
            let dataFiltered = kls === "Semua" ? rawData : rawData.filter(r => r[3] === kls);
            dataFiltered.slice(0, 10).forEach((r, i) => {
                tbody.innerHTML += `<tr><td>${i+1}</td><td>${r[2]}</td><td><b>${r[4]}</b></td><td>${r[1]}</td></tr>`;
            });
            updateChart(dataFiltered);
        }

        function prosesLogin() {
            const pass = document.getElementById("passGuru").value;
            fetch(URL_SCRIPT, { method: "POST", body: JSON.stringify({ aksi: "login", password: pass }) })
            .then(r => r.json()).then(res => {
                if(res.result === "success") {
                    guruAktif = res.namaGuru;
                    document.getElementById("loginGuru").classList.add('hidden');
                    document.getElementById("areaAbsen").classList.remove('hidden');
                    document.getElementById("infoGuru").innerText = "Halo, " + guruAktif;
                } else { alert("Password Salah!"); }
            });
        }

        const listNama = { "XI RPL": ["Andi", "Budi", "Caca", "Dedi", "Euis"], "XII TKR": ["Fahmi", "Gita", "Hana", "Ivan", "Joko"] };

        function tampilDaftarSiswa() {
            const kls = document.getElementById("pilihKelasGuru").value;
            const wadah = document.getElementById("listSiswa");
            wadah.innerHTML = "";
            if(!kls) return document.getElementById("btnSimpan").classList.add('hidden');
            listNama[kls].forEach(n => {
                wadah.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);">
                    <span>${n}</span>
                    <select class="sel-stat" data-nama="${n}" style="width:100px; margin:0;"><option value="Hadir">Hadir</option><option value="Izin">Izin</option><option value="Sakit">Sakit</option><option value="Alfa">Alfa</option></select>
                </div>`;
            });
            document.getElementById("btnSimpan").classList.remove('hidden');
        }

        function simpanAbsen() {
            const kls = document.getElementById("pilihKelasGuru").value;
            const inputs = document.querySelectorAll(".sel-stat");
            let data = [];
            inputs.forEach(i => data.push({ nama: i.dataset.nama, kelas: kls, status: i.value }));
            fetch(URL_SCRIPT, { method: "POST", body: JSON.stringify({ aksi: "simpan", namaGuru: guruAktif, absen: data }) })
            .then(r => r.json()).then(res => { if(res.result === "success") { alert("Berhasil!"); location.reload(); } });
        }

        function updateChart(dataKls) {
            const ctx = document.getElementById('myChart').getContext('2d');
            let s = { Hadir: 0, Izin: 0, Sakit: 0, Alfa: 0 };
            dataKls.forEach(r => { if(s[r[4]] !== undefined) s[r[4]]++; });
            const isDark = document.body.getAttribute("data-theme") === "dark";
            
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, { 
                type: 'doughnut', 
                data: { 
                    labels: Object.keys(s), 
                    datasets: [{ data: Object.values(s), backgroundColor: ['#22c55e', '#f59e0b', '#3b82f6', '#ef4444'], borderWidth: 0 }] 
                },
                options: { 
                    cutout: '70%',
                    plugins: { 
                        legend: { display: false }, // Legenda disembunyikan agar grafik lebih besar di ruang kecil
                    } 
                }
            });
        }

        function buatPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const kls = document.getElementById("filterKelasWali").value;
            let dataPDF = kls === "Semua" ? rawData : rawData.filter(r => r[3] === kls);
            const rows = dataPDF.map((r, i) => [i + 1, r[2], r[3], r[4], r[1]]);
            doc.text("LAPORAN ABSENSI: " + kls, 14, 15);
            doc.autoTable({ head: [['No', 'Nama', 'Kelas', 'Status', 'Tanggal']], body: rows, startY: 25 });
            doc.save("Laporan.pdf");
        }
    </script>
</body>
</html>
